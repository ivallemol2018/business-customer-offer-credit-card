name: API Governance PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Ajustar a la ruta real de los contratos en ESTE repo
      - 'contracts/**'
      - 'specs/**'
      - 'api/**'

# Permisos que el workflow reutilizable necesita para operar
permissions:
  contents: read
  pull-requests: write

jobs:
  api-governance:
    name: Revisar contratos OpenAPI
    uses: ivallemol2018/api-governance/.github/workflows/api-governance.yaml@main
    with:
      # Glob de contratos dentro de ESTE repo (coincide con paths: de arriba)
      contracts_path: 'contracts/**/*.yaml,specs/**/*.json'
      # codigos: 'R-DATM01,R-GENM02'   # opcional: filtrar reglas específicas
      #   Calculadas:   R-GENM02, R-DATM01, R-DATM04  (resueltas por el script)
      #   Verificación: R-GENM01, R-OPEM01, R-DATM02, R-DATM05 (resueltas por Copilot)
      copilot_model: 'gpt-4o'          # opcional, 'gpt-4o' es el default
    secrets: inherit
